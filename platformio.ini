; =============================================================
; TTGO T-Internet-COM — 4G → WiFi Router
; Board  : ESP32-WROVER-E (16 MB flash, 8 MB PSRAM)
; Modem  : SIMCom A7670E (Mini PCIE, SIM7600-compatible)
; Framework: ESP-IDF (latest via PlatformIO)
; =============================================================

[env:ttgo-t-internet-com]
platform = espressif32@7.0.1
board = esp-wrover-kit             ; WROVER-E compatible (has PSRAM)
framework = espidf

monitor_speed = 115200
upload_speed  = 921600
monitor_filters =
    esp32_exception_decoder
    default
    time

build_flags =
    -DCORE_DEBUG_LEVEL=4

; IDF Component Manager reads src/idf_component.yml automatically
