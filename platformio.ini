; =============================================================
; TTGO T-Internet-COM — 4G → WiFi Router
; Board  : ESP32-WROVER-E (16 MB flash, 8 MB PSRAM)
; Modem  : SIMCom A7670E (Mini PCIE, SIM7600-compatible)
; Framework: ESP-IDF (latest via PlatformIO)
; =============================================================

[env:ttgo-t-internet-com]
platform = espressif32@7.0.1
board = esp-wrover-kit             ; WROVER-E compatible (has PSRAM)
framework = espidf

; PlatformIO ignores CONFIG_PARTITION_TABLE_CUSTOM_FILENAME and picks the
; partition table itself, so the csv has to be named here too.
board_build.partitions = partitions.csv
; PlatformIO does not run the CMake rule that turns EMBED_TXTFILES into an
; assembly stub, so the web UI has to be listed here as well.
board_build.embed_txtfiles = src/www/index.html

board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728   ; must match the factory partition size

monitor_speed = 115200
upload_speed  = 921600
monitor_filters =
    esp32_exception_decoder
    default
    time

build_flags =
    -DCORE_DEBUG_LEVEL=4

; IDF Component Manager reads src/idf_component.yml automatically
